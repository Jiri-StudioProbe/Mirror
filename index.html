<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f0f1f3">
<script>
  // With ?tune, if the saved "Bar fade" choice is off, use the plain grey bars before
  // first paint so the browser bars pick up the right colour on load.
  try {
    if (/[?&]tune\b/.test(location.search) && parseFloat(localStorage.getItem('mm.fade.v2')) === 0) {
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#9fb0bd');
      document.documentElement.style.backgroundColor = '#9fb0bd';
    }
  } catch (_) {}
</script>
<title>Misty Mirror</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f0f1f3;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Everything the finger wipes lives in here; the tuning panel sits outside it. */
  #stage {
    position: absolute;
    inset: 0;
    touch-action: none;
  }

  /* Shown before the camera is live: a plain misty pane. */
  #pane {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 30% 20%, #d5dfe6 0%, #a9b9c5 55%, #8196a5 100%);
  }

  /* The feed, mirrored. Its CSS filter is the fog (blurred + brightened). */
  /* Sized explicitly in JS (layoutFeed) to "cover" the stage, rather than relying on
     object-fit, which Safari re-lays-out while the camera stream is starting up. */
  #feed {
    position: absolute;
    left: 50%; top: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translate(-50%, -50%) scaleX(-1) scale(1.12); /* scale hides the blur's soft edges */
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  #feed.live { opacity: 1; }

  /* Sharp feed, masked by wipe times; sits above the fog. */
  #clear {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Fades the top and bottom edges into the toolbar colour #f0f1f3 so the page
     doesn't end in a hard line. Length is EDGE_FADE (0 = off, set in ?tune). */
  .edgefade {
    position: absolute;
    left: 0; right: 0;
    height: var(--edge-fade, 20px);
    pointer-events: none;
  }
  #topfade {
    top: 0;
    background: linear-gradient(to bottom,
      #f0f1f3 0%, rgba(240,241,243,.78) 22%, rgba(240,241,243,.45) 46%,
      rgba(240,241,243,.18) 72%, rgba(240,241,243,0) 100%);
  }
  #bottomfade {
    bottom: 0;
    background: linear-gradient(to top,
      #f0f1f3 0%, rgba(240,241,243,.78) 22%, rgba(240,241,243,.45) 46%,
      rgba(240,241,243,.18) 72%, rgba(240,241,243,0) 100%);
  }

  #hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12vh);
    text-align: center;
    padding: 0 24px;
    color: rgba(255, 255, 255, .92);
    font-size: 17px;
    letter-spacing: .02em;
    text-shadow: 0 1px 12px rgba(40, 60, 80, .55);
    transition: opacity .8s ease;
    pointer-events: none;
  }
  #hint.hidden { opacity: 0; }

  /* Tuning panel, only with ?tune */
  #tune {
    position: fixed;
    left: 8px; right: 8px;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    max-width: 380px;
    box-sizing: border-box;
    padding: 10px 12px 8px;
    border-radius: 12px;
    background: rgba(20, 28, 36, .78);
    color: #fff;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    z-index: 10;
  }
  #tune .row { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 8px; margin: 4px 0; }
  #tune .row output { text-align: right; font-variant-numeric: tabular-nums; }
  #tune input[type=range] { width: 100%; margin: 0; touch-action: pan-x; }
  #tune .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #tune button {
    font: inherit; color: #fff; background: rgba(255,255,255,.16);
    border: 0; border-radius: 8px; padding: 6px 12px;
  }
  #tune .info { flex: 1; text-align: right; opacity: .75; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage">
  <div id="pane"></div>
  <video id="feed" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="clear"></canvas>
  <div id="topfade" class="edgefade"></div>
  <div id="bottomfade" class="edgefade"></div>
  <div id="hint" class="hidden"></div>
</div>

<script>
(() => {
  'use strict';

  // ---- Tunables ------------------------------------------------------------
  const HOLD_MS      = 7000;  // fully clear after a wipe
  const FADE_MS      = 5000;  // then fades back to fog over this long
  // Tuned live with ?tune. BRUSH_RADIUS is used when the device reports no contact size.
  const DEFAULTS = {
    BRUSH_MIN: 2,           // CSS px, smallest brush from contact size
    BRUSH_RADIUS: 17,       // CSS px, brush at the reference contact size
    BRUSH_MAX: 77,          // CSS px, largest brush from contact size
    EDGE_SOFTNESS: 0.7,     // wipe-edge softness; 1 = softest, lower = sharper
    EDGE_FADE: 20,          // CSS px, top/bottom fade into the toolbar colour; 0 = off
    SOUND: 50,              // wipe sound volume, 0-100; 0 = off
    WRITE_WIDTH: 3          // CSS px, line width of the greeting written on the mirror; 0 = off
  };
  const cfg = Object.assign({}, DEFAULTS);
  const tuning = /[?&]tune\b/.test(location.search);
  if (tuning) {
    // Values saved from the panel override the defaults (only with ?tune).
    try {
      const f = parseFloat(localStorage.getItem('mm.fade.v2'));
      const v = parseFloat(localStorage.getItem('mm.sound.v2'));
      if (!isNaN(f)) cfg.EDGE_FADE = f;
      if (!isNaN(v)) cfg.SOUND = v;
    } catch (_) {}
  }
  // Fade on: bars and page background are #f0f1f3 and the edges fade into it.
  // Fade off (0): the original grey bars, no fade.
  const applyEdgeFade = () => {
    const on = cfg.EDGE_FADE > 0;
    const colour = on ? '#f0f1f3' : '#9fb0bd';
    stage.style.setProperty('--edge-fade', cfg.EDGE_FADE + 'px');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', colour);
    document.documentElement.style.backgroundColor = colour;
    document.body.style.backgroundColor = colour;
    if (tuning) { try { localStorage.setItem('mm.fade.v2', String(cfg.EDGE_FADE)); } catch (_) {} }
  };
  const REF_CONTACT  = 28;    // CSS px, finger contact diameter that gives cfg.BRUSH_RADIUS
  const FOG_BLUR     = 28;    // CSS px
  // --------------------------------------------------------------------------
  const CELL        = 8;      // mask grid cell size in CSS px (~1/8 resolution)
  const SMOOTH_PASS = 2;      // blur passes over the mask grid
  let EDGE_W = 0, EDGE_C = 1;   // 3-tap kernel weights, derived from cfg.EDGE_SOFTNESS
  const MAX_DPR     = 1.5;

  const stage  = document.getElementById('stage');
  const feed   = document.getElementById('feed');
  const canvas = document.getElementById('clear');
  const hint   = document.getElementById('hint');
  const ctx    = canvas.getContext('2d');

  // ?tune shows sliders for the brush and edge softness; ?debug shows the contact readout alone.
  const params = new URLSearchParams(location.search);
  let debug = null;
  if (params.has('tune') || params.has('debug')) {
    debug = document.createElement('div');
    debug.textContent = 'contact: touch to measure';
    if (!params.has('tune')) {
      debug.style.cssText = 'position:fixed;top:12px;left:12px;font:13px monospace;color:#fff;' +
        'background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;pointer-events:none';
      document.body.appendChild(debug);
    }
  }

  feed.style.filter = `blur(${FOG_BLUR}px) brightness(1.3) saturate(.75) contrast(.9)`;
  feed.style.webkitFilter = feed.style.filter;

  // ---- State ---------------------------------------------------------------
  let W = 0, H = 0, dpr = 1;
  let gw = 0, gh = 0;
  let wipedAt;                  // Float64Array: last-wipe timestamp per cell
  let alpha, tmp;               // Float32Array scratch for the smoothed mask
  let maskCanvas, maskCtx, maskImg;
  let lastWipe = -Infinity;     // newest wipe anywhere, to skip idle frames
  let camera = 'idle';          // idle | asking | live | error
  let wipedOnce = false;
  let pointer = null;           // { id, x, y }
  let brush = cfg.BRUSH_RADIUS;     // current brush radius, CSS px
  let touchDiameter = 0;        // latest Touch radius * 2 (iOS fallback)
  let drewLastFrame = false;
  let ink = null;               // the greeting, see "Greeting" below
  let maskFull, mfCtx;          // full-size mask used while the greeting is alive

  // Make the video element exactly the "cover" size for the stage.
  function layoutFeed() {
    const vw = feed.videoWidth, vh = feed.videoHeight;
    if (!vw || !vh || !W || !H) return;
    const s = Math.max(W / vw, H / vh);
    feed.style.width  = vw * s + 'px';
    feed.style.height = vh * s + 'px';
    feed.style.objectFit = 'fill';
  }

  function resize() {
    const nw = stage.clientWidth, nh = stage.clientHeight;
    if (nw === W && nh === H && wipedAt) { layoutFeed(); return; }
    W = nw;
    H = nh;
    dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    gw = Math.ceil(W / CELL);
    gh = Math.ceil(H / CELL);
    wipedAt = new Float64Array(gw * gh).fill(-Infinity);
    alpha = new Float32Array(gw * gh);
    tmp   = new Float32Array(gw * gh);

    maskCanvas = document.createElement('canvas');
    maskCanvas.width = gw;
    maskCanvas.height = gh;
    maskCtx = maskCanvas.getContext('2d');
    maskImg = maskCtx.createImageData(gw, gh);
    maskFull = document.createElement('canvas');
    maskFull.width = canvas.width;
    maskFull.height = canvas.height;
    mfCtx = maskFull.getContext('2d');
    ink = null;
    lastWipe = -Infinity;
    drewLastFrame = false;
    layoutFeed();
  }

  // ---- Wipe sound ----------------------------------------------------------
  // audio/squeaks.mp3 is a set of short finger-on-glass squeaks cut from a single
  // recording. While the finger is actually moving over the glass we play one
  // randomly chosen squeak at a time (louder when faster); when it stops, we fade out.
  const SQUEAKS = [[0.0,0.38],[0.43,0.3],[0.78,0.34],[1.17,0.31],[1.53,0.27],[1.85,0.33],[2.23,0.27],[2.55,0.32],[2.92,0.31],[3.28,0.63],[3.96,0.42],[4.43,0.39],[4.87,0.31],[5.23,1.14],[6.42,0.27],[6.74,1.11],[7.9,0.78],[8.73,0.55],[9.33,1.08],[10.46,0.99],[11.5,0.33],[11.88,0.32],[12.25,0.68],[12.98,0.28],[13.31,0.3],[13.66,0.92],[14.63,1.17],[15.85,0.6],[16.5,1.17],[17.72,0.53],[18.3,1.35],[19.7,0.54],[20.29,0.76],[21.1,1.19],[22.34,0.42],[22.81,0.34],[23.2,0.35],[23.6,0.29],[23.94,1.23],[25.22,0.27],[25.54,0.45],[26.04,0.4],[26.49,0.45],[26.99,0.29],[27.33,0.43],[27.81,0.33],[28.19,0.42]]; // [start s, length s] within squeaks.mp3
  const SPEED_ON  = 140;  // px/s the finger must exceed to start a squeak
  const SPEED_OFF = 60;   // px/s below which the current squeak is faded out
  let audio = null;       // built lazily on a user gesture
  let moved = 0;          // px travelled since the last frame
  let speed = 0;          // smoothed finger speed, px/s
  let voice = null;       // { src, gain, endsAt }
  let nextAt = 0;         // audio time before which no new squeak starts
  const recent = [];      // last few squeak indices, to avoid repeats
  let slowSince = 0;      // when the finger last dropped below SPEED_OFF (ms), 0 if not slow
  let lastSoundT = 0;

  function ensureAudio() {
    if (cfg.SOUND <= 0) return;
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iOS: let Web Audio play even with the silent switch on.
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      audio = { ctx, master, buffer: null };
      fetch('audio/squeaks.mp3')
        .then(r => r.arrayBuffer())
        .then(data => new Promise((ok, fail) => ctx.decodeAudioData(data, ok, fail)))
        .then(buf => { audio.buffer = buf; })
        .catch(() => {});
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
  }

  function startSqueak(t) {
    let idx;
    do { idx = Math.floor(Math.random() * SQUEAKS.length); } while (recent.includes(idx));
    recent.push(idx);
    if (recent.length > 4) recent.shift();
    const [off, len] = SQUEAKS[idx];
    const rate = 0.95 + Math.random() * 0.12;           // slight pitch variation
    const src = audio.ctx.createBufferSource();
    src.buffer = audio.buffer;
    src.playbackRate.value = rate;
    const gain = audio.ctx.createGain();
    gain.gain.value = 0;
    src.connect(gain).connect(audio.master);
    src.start(t, off, len);
    voice = { src, gain, endsAt: t + len / rate };
  }

  function stopSqueak(t) {
    if (!voice) return;
    voice.gain.gain.cancelScheduledValues(t);
    voice.gain.gain.setTargetAtTime(0, t, 0.02);
    try { voice.src.stop(t + 0.12); } catch (_) {}
    voice = null;
  }

  function updateSound(now) {
    const dt = Math.max(1, now - lastSoundT) / 1000;
    lastSoundT = now;
    const inst = moved / dt;
    moved = 0;
    speed += (inst - speed) * Math.min(1, dt * 14);
    if (!audio) return;
    const t = audio.ctx.currentTime;
    audio.master.gain.setTargetAtTime(Math.pow(cfg.SOUND / 100, 1.5), t, 0.05);
    if (!audio.buffer) return;

    // Start above SPEED_ON; once playing, only stop after ~100ms below SPEED_OFF so
    // tiny pauses and direction changes don't chop the squeak.
    if (speed < SPEED_OFF) { if (!slowSince) slowSince = now; } else slowSince = 0;
    const smudging = pointer !== null &&
      (voice ? !(slowSince && now - slowSince > 100) : speed > SPEED_ON);
    if (voice && t >= voice.endsAt) {            // finished naturally
      voice = null;
      nextAt = t + 0.04 + Math.random() * 0.16;  // short, uneven pause between squeaks
    }
    if (!smudging) { stopSqueak(t); return; }
    if (!voice && t >= nextAt) startSqueak(t);
    if (voice) {
      // Louder when the finger moves faster.
      const level = 0.3 + 0.7 * Math.min(1, speed / 800);
      voice.gain.gain.setTargetAtTime(level, t, 0.03);
    }
  }

  const applySound = () => {
    if (tuning) { try { localStorage.setItem('mm.sound.v2', String(cfg.SOUND)); } catch (_) {} }
    ensureAudio();
  };

  // ---- Wiping --------------------------------------------------------------
  function stamp(x, y, now) {
    const r  = brush / CELL;
    const cx = x / CELL, cy = y / CELL;
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(gw - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(gh - 1, Math.ceil(cy + r));
    const r2 = r * r;
    for (let j = y0; j <= y1; j++) {
      const dy = j + 0.5 - cy;
      for (let i = x0; i <= x1; i++) {
        const dx = i + 0.5 - cx;
        if (dx * dx + dy * dy <= r2) wipedAt[j * gw + i] = now;
      }
    }
    lastWipe = now;
    if (ink) eraseInk(x, y, brush);
  }

  // Stamp along the segment so fast swipes leave no gaps.
  function wipeLine(x0, y0, x1, y1) {
    const now  = performance.now();
    const dist = Math.hypot(x1 - x0, y1 - y0);
    moved += dist;
    const step = brush / 4;
    const n    = Math.max(1, Math.ceil(dist / step));
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      stamp(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, now);
    }
  }

  // Finger contact diameter in CSS px, or 0 if the device doesn't report one.
  function contactDiameter(e) {
    if (e.pointerType !== 'touch') return 0;
    const d = Math.max(e.width || 0, e.height || 0);
    if (d > 1) return d;           // Chrome / Android
    return touchDiameter;          // Safari: from Touch.radiusX/Y
  }

  function updateBrush(e) {
    const d = contactDiameter(e);
    if (d > 0) {
      const target = Math.min(cfg.BRUSH_MAX, Math.max(cfg.BRUSH_MIN, cfg.BRUSH_RADIUS * d / REF_CONTACT));
      brush += (target - brush) * 0.35;  // contact readings are noisy
    } else {
      brush = cfg.BRUSH_RADIUS;
    }
    if (debug) debug.textContent = `contact ${d.toFixed(1)}px \u2192 brush ${brush.toFixed(1)}px`;
  }

  function readTouch(e) {
    const t = e.touches[0];
    if (!t) return;
    const r = Math.max(t.radiusX || 0, t.radiusY || 0);
    touchDiameter = r > 0 ? r * 2 : 0;
  }

  function onDown(e) {
    if (pointer) return;
    // Nothing to wipe until the camera is live (a touch only retries a failed start).
    if (camera !== 'live') { if (camera === 'error') startCamera(); return; }
    pointer = { id: e.pointerId, x: e.clientX, y: e.clientY };
    brush = cfg.BRUSH_RADIUS;
    updateBrush(e);
    ensureAudio();
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    wipeLine(pointer.x, pointer.y, pointer.x, pointer.y);
    noteWipe();
    e.preventDefault();
  }

  function onMove(e) {
    if (!pointer || e.pointerId !== pointer.id) return;
    updateBrush(e);
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    const list = events.length ? events : [e];
    for (const ev of list) {
      wipeLine(pointer.x, pointer.y, ev.clientX, ev.clientY);
      pointer.x = ev.clientX;
      pointer.y = ev.clientY;
    }
    noteWipe();
    e.preventDefault();
  }

  function onUp(e) {
    if (pointer && e.pointerId === pointer.id) pointer = null;
    ensureAudio();   // iOS only unlocks audio on touch end
  }

  function noteWipe() {
    if (!wipedOnce && camera === 'live') {
      wipedOnce = true;
      hint.classList.add('hidden');
    }
  }

  // ---- Camera --------------------------------------------------------------
  function say(text) {
    hint.textContent = text;
    hint.classList.remove('hidden');
  }

  // Wait until the stream is really delivering frames before fading the feed in,
  // so any start-up resizing happens while it is still invisible.
  function firstFrames() {
    return new Promise(resolve => {
      const done = () => setTimeout(resolve, 150);
      if (feed.requestVideoFrameCallback) {
        feed.requestVideoFrameCallback(() => feed.requestVideoFrameCallback(done));
        setTimeout(resolve, 1500); // never hold the feed back for long
      } else {
        setTimeout(resolve, 500);
      }
    });
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camera = 'error';
      say(window.isSecureContext
        ? 'This browser has no camera access'
        : 'Camera needs HTTPS or localhost');
      return;
    }
    camera = 'asking';
    setTimeout(() => { if (camera === 'asking') say('Allow camera access…'); }, 400);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: 'user',
          width:  { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30 }
        }
      });
      feed.srcObject = stream;
      await feed.play();
      layoutFeed();
      await firstFrames();
      layoutFeed();
      feed.classList.add('live');
      camera = 'live';
      wipedOnce = false;
      hint.classList.add('hidden');
      greet();
    } catch (err) {
      camera = 'error';
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      say(denied ? 'Camera blocked — allow access, then touch again'
                 : 'Couldn’t start the camera — touch to retry');
    }
  }

  // ---- Greeting ------------------------------------------------------------
  // "Hello you" is written on the mist as if by a finger: single-line handwriting
  // strokes are traced point by point, and each point is a clear (wiped) spot that
  // holds and fades like any other wipe. Wiping over it erases it.
  const GREETING = 'Hello you';
  const GLYPHS = {
  H: { adv: 112, strokes: [
    'M 14 14 C 20 70 18 140 12 200',
    'M 86 6 C 92 70 88 140 82 196',
    'M 10 104 C 36 96 62 112 90 100'
  ]},
  e: { adv: 88, strokes: [
    'M 16 160 C 40 162 74 154 68 134 C 62 112 26 112 20 152 C 15 190 48 210 80 188'
  ]},
  l: { adv: 54, strokes: [
    'M 30 8 C 40 60 34 140 30 190 C 29 204 40 208 56 192'
  ]},
  o: { adv: 88, strokes: [
    'M 56 116 C 26 110 10 150 24 184 C 38 210 78 202 80 160 C 82 128 66 114 54 116 C 66 116 78 112 90 104'
  ]},
  y: { adv: 98, strokes: [
    'M 14 114 C 16 156 30 184 52 184 C 68 184 76 156 78 114',
    'M 80 112 C 82 170 80 236 62 270 C 50 292 24 292 22 274'
  ]},
  u: { adv: 98, strokes: [
    'M 14 114 C 16 156 28 186 52 186 C 68 186 76 160 78 114',
    'M 80 112 C 80 150 80 176 84 198 C 87 208 98 204 106 194'
  ]},
  ' ': { adv: 50, strokes: [] }
};
  const WRITE_SLANT = 0.18;    // lean of the handwriting
  const WRITE_TILT  = -0.05;   // radians; slight upward slope
  const PEN_SPEED   = 420;     // px/s
  const WRITE_STEP  = 2;       // px between traced points

  function parseStrokes(d) {
    const t = d.split(/\s+/);
    const segs = [];
    let i = 0, cx = 0, cy = 0;
    while (i < t.length) {
      const k = t[i++];
      if (k === 'M') { cx = +t[i++]; cy = +t[i++]; }
      else if (k === 'C') {
        const c1x = +t[i++], c1y = +t[i++], c2x = +t[i++], c2y = +t[i++], x = +t[i++], y = +t[i++];
        segs.push([cx, cy, c1x, c1y, c2x, c2y, x, y]);
        cx = x; cy = y;
      }
    }
    const start = t[0] === 'M' ? [+t[1], +t[2]] : [0, 0];
    return { start, segs };
  }

  function buildInk(startAt) {
    if (cfg.WRITE_WIDTH <= 0) return null;
    let units = 0;
    for (const ch of GREETING) units += (GLYPHS[ch] || GLYPHS[' ']).adv;
    const sc = Math.min(W * 0.76 / units, 0.55);
    const ox0 = (W - units * sc) / 2;
    const oy = H * 0.42 - 150 * sc;
    const mx = W / 2, my = H * 0.42;
    const cosT = Math.cos(WRITE_TILT), sinT = Math.sin(WRITE_TILT);
    const xs = [], ys = [], ts = [], first = [];
    let ox = ox0, clock = startAt;
    for (const ch of GREETING) {
      const g = GLYPHS[ch] || GLYPHS[' '];
      for (const d of g.strokes) {
        const { start, segs } = parseStrokes(d);
        // Flatten the curves to points in screen px.
        const raw = [];
        const put = (x, y) => {
          const ux = x + (200 - y) * WRITE_SLANT;
          const px = ox + ux * sc, py = oy + y * sc;
          raw.push([mx + (px - mx) * cosT - (py - my) * sinT, my + (px - mx) * sinT + (py - my) * cosT]);
        };
        put(start[0], start[1]);
        for (const [x0, y0, x1, y1, x2, y2, x3, y3] of segs) {
          for (let k = 1; k <= 24; k++) {
            const u = k / 24, v = 1 - u;
            put(v*v*v*x0 + 3*v*v*u*x1 + 3*v*u*u*x2 + u*u*u*x3,
                v*v*v*y0 + 3*v*v*u*y1 + 3*v*u*u*y2 + u*u*u*y3);
          }
        }
        // Resample at an even spacing so the pen moves at a steady speed.
        let carry = 0, px = raw[0][0], py = raw[0][1], isFirst = true;
        xs.push(px); ys.push(py); ts.push(clock); first.push(1);
        for (let k = 1; k < raw.length; k++) {
          let [qx, qy] = raw[k];
          let seg = Math.hypot(qx - px, qy - py);
          while (carry + seg >= WRITE_STEP) {
            const f = (WRITE_STEP - carry) / seg;
            px += (qx - px) * f; py += (qy - py) * f;
            seg = Math.hypot(qx - px, qy - py);
            carry = 0;
            clock += WRITE_STEP / PEN_SPEED * 1000;
            xs.push(px); ys.push(py); ts.push(clock); first.push(0);
          }
          carry += seg; px = qx; py = qy;
        }
        clock += 110;               // lift the finger between strokes
      }
      clock += ch === ' ' ? 260 : 50;
      ox += g.adv * sc;
    }
    return {
      n: xs.length,
      xs: Float32Array.from(xs), ys: Float32Array.from(ys),
      ts: Float64Array.from(ts), first: Uint8Array.from(first),
      erased: new Uint8Array(xs.length),
      end: clock
    };
  }

  const inkAlive = now => ink && now < ink.end + HOLD_MS + FADE_MS;

  function greet() {
    const now = performance.now();
    ink = buildInk(now + 500);
    if (!ink) { say('Wipe the mist with your finger'); return; }
    // Show the usual hint once the writing is done, unless they have already wiped.
    setTimeout(() => { if (!wipedOnce) say('Wipe the mist with your finger'); }, ink.end - now + 400);
  }

  function eraseInk(x, y, r) {
    const r2 = r * r;
    for (let i = 0; i < ink.n; i++) {
      const dx = ink.xs[i] - x, dy = ink.ys[i] - y;
      if (dx * dx + dy * dy <= r2) ink.erased[i] = 1;
    }
  }

  // Draw the written part of the greeting into the mask (alpha = how clear).
  function drawInk(c, now) {
    const levels = 8;
    const paths = [];
    for (let l = 0; l <= levels; l++) paths.push(null);
    for (let i = 1; i < ink.n; i++) {
      if (ink.first[i] || ink.ts[i] > now || ink.erased[i] || ink.erased[i - 1]) continue;
      const age = now - ink.ts[i];
      const a = age < HOLD_MS ? 1 : age < HOLD_MS + FADE_MS ? 1 - (age - HOLD_MS) / FADE_MS : 0;
      const l = Math.ceil(a * levels);
      if (l <= 0) continue;
      const p = paths[l] || (paths[l] = new Path2D());
      p.moveTo(ink.xs[i - 1], ink.ys[i - 1]);
      p.lineTo(ink.xs[i], ink.ys[i]);
    }
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = '#000';
    for (let l = 1; l <= levels; l++) {
      if (!paths[l]) continue;
      c.globalAlpha = 0.3 * l / levels;               // soft shoulder
      c.lineWidth = cfg.WRITE_WIDTH * 2.2;
      c.stroke(paths[l]);
      c.globalAlpha = l / levels;                     // core line
      c.lineWidth = cfg.WRITE_WIDTH;
      c.stroke(paths[l]);
    }
    c.globalAlpha = 1;
  }

  // ---- Rendering -----------------------------------------------------------
  function blurH(src, dst) {
    // horizontal, radius 1, edge clamped
    for (let j = 0; j < gh; j++) {
      const row = j * gw;
      for (let i = 0; i < gw; i++) {
        const a = src[row + (i > 0 ? i - 1 : 0)];
        const b = src[row + i];
        const c = src[row + (i < gw - 1 ? i + 1 : i)];
        dst[row + i] = a * EDGE_W + b * EDGE_C + c * EDGE_W;
      }
    }
  }
  function blurV(src, dst) {
    for (let j = 0; j < gh; j++) {
      const up = (j > 0 ? j - 1 : 0) * gw;
      const mid = j * gw;
      const dn = (j < gh - 1 ? j + 1 : j) * gw;
      for (let i = 0; i < gw; i++) {
        dst[mid + i] = (src[up + i] + src[dn + i]) * EDGE_W + src[mid + i] * EDGE_C;
      }
    }
  }

  function buildMask(now) {
    EDGE_W = cfg.EDGE_SOFTNESS * cfg.EDGE_SOFTNESS / 3; // side weight of the 3-tap kernel
    EDGE_C = 1 - 2 * EDGE_W;
    // Per-cell clearness: 1 for HOLD_MS after a wipe, then linear ramp to 0 over FADE_MS.
    for (let k = 0; k < alpha.length; k++) {
      const age = now - wipedAt[k];
      alpha[k] = age < HOLD_MS ? 1
               : age < HOLD_MS + FADE_MS ? 1 - (age - HOLD_MS) / FADE_MS
               : 0;
    }
    // Soften the grid so the upscale has no visible blockiness.
    for (let p = 0; p < SMOOTH_PASS; p++) {
      blurH(alpha, tmp);
      blurV(tmp, alpha);
    }
    const d = maskImg.data;
    for (let k = 0, o = 3; k < alpha.length; k++, o += 4) d[o] = alpha[k] * 255 + 0.5;
    maskCtx.putImageData(maskImg, 0, 0);
  }

  function drawFeedMirrored() {
    const vw = feed.videoWidth, vh = feed.videoHeight;
    if (!vw || !vh) return false;
    // Same crop as CSS object-fit: cover.
    const s  = Math.max(W / vw, H / vh);
    const sw = W / s, sh = H / s;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(feed, sx, sy, sw, sh, 0, 0, W, H);
    ctx.restore();
    return true;
  }

  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now();
    updateSound(now);
    if (ink && !inkAlive(now)) ink = null;
    const active = camera === 'live' && feed.readyState >= 2 &&
                   (now - lastWipe < HOLD_MS + FADE_MS || ink);
    if (!active) {
      if (drewLastFrame) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drewLastFrame = false;
      }
      return;
    }

    buildMask(now);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    if (!drawFeedMirrored()) return;
    ctx.globalCompositeOperation = 'destination-in';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if (ink) {
      // Wipes plus the greeting, combined at full resolution so thin lines stay crisp.
      mfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mfCtx.globalCompositeOperation = 'source-over';
      mfCtx.clearRect(0, 0, W, H);
      mfCtx.imageSmoothingEnabled = true;
      mfCtx.imageSmoothingQuality = 'high';
      mfCtx.drawImage(maskCanvas, 0, 0, gw * CELL, gh * CELL);
      drawInk(mfCtx, now);
      ctx.drawImage(maskFull, 0, 0, W, H);
    } else {
      ctx.drawImage(maskCanvas, 0, 0, gw * CELL, gh * CELL);
    }
    ctx.globalCompositeOperation = 'source-over';
    drewLastFrame = true;
  }

  // ---- Tuning panel (?tune) -------------------------------------------------
  function buildPanel() {
    const sliders = [
      ['BRUSH_MIN',     'Thin radius',    2, 40, 1],
      ['BRUSH_RADIUS',  'Medium radius',  4, 60, 1],
      ['BRUSH_MAX',     'Thick radius',   8, 90, 1],
      ['EDGE_SOFTNESS', 'Edge softness',  0.2, 1.2, 0.05],
      ['EDGE_FADE',     'Bar fade',       0, 160, 2],
      ['SOUND',         'Sound volume',   0, 100, 5],
      ['WRITE_WIDTH',   'Writing width',  0, 8, 0.5]
    ];
    const panel = document.createElement('div');
    panel.id = 'tune';
    const outs = {};
    const fmt = (k, v) => k === 'EDGE_SOFTNESS' ? Number(v).toFixed(2) : k === 'WRITE_WIDTH' ? Number(v).toFixed(1) : String(Math.round(v));
    for (const [key, label, min, max, step] of sliders) {
      const row = document.createElement('label');
      row.className = 'row';
      const name = document.createElement('span');
      name.textContent = label;
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step;
      input.value = cfg[key];
      const out = document.createElement('output');
      out.textContent = fmt(key, cfg[key]);
      input.addEventListener('input', () => {
        cfg[key] = parseFloat(input.value);
        out.textContent = fmt(key, cfg[key]);
        brush = cfg.BRUSH_RADIUS;
        applyEdgeFade();
        applySound();
      });
      outs[key] = [input, out];
      row.append(name, input, out);
      panel.appendChild(row);
    }
    const bar = document.createElement('div');
    bar.className = 'bar';
    const copy = document.createElement('button');
    copy.textContent = 'Copy';
    const reset = document.createElement('button');
    reset.textContent = 'Reset';
    const replay = document.createElement('button');
    replay.textContent = 'Replay';
    replay.addEventListener('click', () => { if (camera === 'live') greet(); });
    const line = () => sliders.map(([k]) => `${k}=${fmt(k, cfg[k])}`).join(' ');
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(line()); copy.textContent = 'Copied'; }
      catch (_) { copy.textContent = 'Copy failed'; }
      setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
    });
    reset.addEventListener('click', () => {
      Object.assign(cfg, DEFAULTS);
      for (const [k, [input, out]] of Object.entries(outs)) { input.value = cfg[k]; out.textContent = fmt(k, cfg[k]); }
      applyEdgeFade();
      applySound();
    });
    debug.className = 'info';
    bar.append(copy, reset, replay, debug);
    panel.appendChild(bar);
    const note = document.createElement('div');
    note.style.cssText = 'margin-top:6px;opacity:.6;font-size:11px';
    note.textContent = 'Bar fade and sound are saved on this device (?tune only). Reload to update the browser bar colour. Sound plays after your first touch.';
    panel.appendChild(note);
    document.body.appendChild(panel);
  }
  if (params.has('tune')) buildPanel();
  applyEdgeFade();

  // ---- Boot ----------------------------------------------------------------
  feed.addEventListener('loadedmetadata', layoutFeed);
  feed.addEventListener('resize', layoutFeed);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  stage.addEventListener('touchstart', readTouch, { passive: true });
  stage.addEventListener('touchmove', readTouch, { passive: true });
  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  resize();
  requestAnimationFrame(frame);
  startCamera();   // ask for the camera straight away
})();
</script>
</body>
</html>
